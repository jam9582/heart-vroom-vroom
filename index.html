<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a1428">
  <title>심장이 부릉부릉</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game">
    <!-- 게임 화면 -->
    <div id="bg"></div>
    <div id="bg-overlay"></div>
    <div id="rain"></div>
    <div id="stage"></div>
    <div id="flash"></div>
    <div id="sfx"></div>
    <div id="cards"></div>

    <div id="hud">
      <button id="hud-toggle" type="button" aria-label="호감도 표시 전환">♥</button>
      <div id="hud-list"></div>
    </div>
    <div id="toasts"></div>

    <div id="dialog">
      <div id="nameplate"><i class="lamp-dot"></i><span id="nameplate-name"></span></div>
      <div id="text"></div>
      <div id="next-indicator">▼</div>
      <div id="menu">
        <button type="button" data-action="log">로그</button>
        <button type="button" data-action="auto">자동</button>
        <button type="button" data-action="title">타이틀</button>
      </div>
    </div>

    <div id="choices" class="layer">
      <div id="choice-prompt"></div>
      <div id="choice-list"></div>
    </div>

    <!-- 엔딩 -->
    <div id="ending" class="layer">
      <div class="ending-card">
        <div id="ending-badge"></div>
        <div id="ending-title"></div>
        <div id="ending-subtitle"></div>
        <div id="ending-scores"></div>
        <div id="ending-cards"></div>
        <button id="restart" class="btn-primary" type="button">처음부터</button>
      </div>
    </div>

    <!-- 대사 로그 -->
    <div id="log" class="layer modal">
      <div class="modal-box">
        <div class="modal-head"><span>대사 로그</span><button type="button" data-action="close">닫기</button></div>
        <div id="log-list" class="modal-body"></div>
      </div>
    </div>

    <!-- 타이틀 -->
    <div id="title-screen" class="layer is-open">
      <div class="road"></div>
      <div class="title-inner">
        <h1 id="title-logo"><img id="title-logo-img" alt="심장이 부릉부릉"><span id="title-logo-text">심장이 부릉부릉</span></h1>
        <div id="title-sub"></div>
        <div class="title-buttons">
          <button type="button" class="btn-primary" data-action="start">시작하기</button>
          <button type="button" class="btn-ghost" data-action="album">엔딩 앨범</button>
        </div>
        <div id="credits">
          <div id="credits-team"></div>
          <div id="credits-members"></div>
        </div>
      </div>
    </div>

    <!-- 공략 대상 선택 -->
    <div id="select" class="layer">
      <div class="select-inner">
        <div class="select-head">
          <button type="button" class="select-back" data-action="back">‹ 타이틀</button>
          <div id="select-title"></div>
        </div>
        <div id="select-list"></div>
        <div id="select-quote"></div>
        <button id="select-go" type="button" class="btn-primary" data-action="go" disabled>이 사람으로 시작</button>
      </div>
    </div>

    <!-- 엔딩 앨범 -->
    <div id="album" class="layer modal">
      <div class="modal-box">
        <div class="modal-head"><span>엔딩 앨범</span><button type="button" data-action="close">닫기</button></div>
        <div id="album-list" class="modal-body"></div>
      </div>
    </div>

    <div id="fade"></div>
    <button id="sound-toggle" type="button" aria-label="소리 끄기">🔊</button>
  </div>
  <script src="game.js"></script>
</body>
</html>
